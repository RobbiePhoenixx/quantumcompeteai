<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <title>Quantum Compete AI Logo</title>

  <!-- Background -->
  <rect width="800" height="400" fill="#17181C"/>

  <!-- Gold accent bar -->
  <rect x="60" y="190" width="680" height="3" fill="#C7A35A" opacity="0.4"/>

  <!-- Main logo text -->
  <text x="400" y="175"
        font-family="Georgia, serif"
        font-size="72"
        font-weight="bold"
        fill="#C7A35A"
        text-anchor="middle"
        letter-spacing="6">QUANTUM</text>

  <text x="400" y="255"
        font-family="Georgia, serif"
        font-size="36"
        fill="#FFFFFF"
        text-anchor="middle"
        letter-spacing="12">COMPETE AI</text>

  <!-- Tagline -->
  <text x="400" y="310"
        font-family="Arial, sans-serif"
        font-size="16"
        fill="#888888"
        text-anchor="middle"
        letter-spacing="3">BUILT TO WIN</text>

  <!-- Corner marks (decorative) -->
  <line x1="60" y1="60"  x2="100" y2="60"  stroke="#C7A35A" stroke-width="2"/>
  <line x1="60" y1="60"  x2="60"  y2="100" stroke="#C7A35A" stroke-width="2"/>
  <line x1="740" y1="60"  x2="700" y2="60"  stroke="#C7A35A" stroke-width="2"/>
  <line x1="740" y1="60"  x2="740" y2="100" stroke="#C7A35A" stroke-width="2"/>
  <line x1="60" y1="340"  x2="100" y2="340" stroke="#C7A35A" stroke-width="2"/>
  <line x1="60" y1="340"  x2="60"  y2="300" stroke="#C7A35A" stroke-width="2"/>
  <line x1="740" y1="340" x2="700" y2="340" stroke="#C7A35A" stroke-width="2"/>
  <line x1="740" y1="340" x2="740" y2="300" stroke="#C7A35A" stroke-width="2"/>
</svg>
